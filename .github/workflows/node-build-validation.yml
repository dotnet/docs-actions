name: node build and test

on:
  push:
    branches: [ main ]
    paths:
    - 'ops-build-reporter/**'
    - 'status-checker/**'
    - '.github/workflows/ops-build-*.yml'
    - '.github/workflows/node-build-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
    - 'ops-build-reporter/**'
    - 'status-checker/**'
    - '.github/workflows/ops-build-*.yml'
    - '.github/workflows/node-build-validation.yml'

jobs:
  build:
    name: build ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [ops-build-reporter, status-checker]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: ./${{ matrix.action }}/package-lock.json
    - run: |
        cd ./${{ matrix.action }}/
        npm ci
        npm run build --if-present
        npm test
        npm run package
