name: Collect and validate OPS build

on:
  workflow_call:
    inputs:
      max_wait_time_minutes:
        type: number
        default: 20
      collapsible_after:
        type: number
        default: 12
      max_row_count:
        type: number
        default: 50

permissions:
  statuses: read

jobs:
  collect:
    name: Collect OPS diagnostics and previews
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Produce report artifacts
        id: report
        uses: dotnet/docs-actions/ops-build-reporter@main
        with:
          repo_token: ${{ github.token }}
          max_wait_time_minutes: ${{ inputs.max_wait_time_minutes }}
          collapsible_after: ${{ inputs.collapsible_after }}
          max_row_count: ${{ inputs.max_row_count }}
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ops-build-report
          path: ${{ steps.report.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  validate:
    name: Look for build warnings
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: dotnet/docs-actions/status-checker@main
        with:
          repo_token: ${{ github.token }}
