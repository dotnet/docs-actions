name: 'OPS Build Reporter'
description: 'Produces preview and diagnostic artifacts from OPS using a read-only pull_request token. Does not update pull requests.'
author: 'Genevieve Warren'
inputs:
  repo_token:
    description: 'The GITHUB_TOKEN. Requires statuses: read; no write permissions or repository secrets.'
    required: true
  output_directory:
    description: 'Directory for report.json and preview.md. Defaults to RUNNER_TEMP/ops-build-report.'
  collapsible_after:
    description: 'The number at which the automated preview table defaults as collapsed but expandable, using the HTML summary and details elements.'
    default: '12'
  max_row_count:
    description: 'The maximum number of rows to display in the automated preview table.'
    default: '50'
  max_wait_time_minutes:
    description: 'The maximum number of minutes to wait for the OpenPublishing.Build status check to complete.'
    default: '20'
outputs:
  artifact_path:
    description: 'Directory to upload with actions/upload-artifact.'
runs:
  using: 'node24'
  main: 'dist/index.js'
